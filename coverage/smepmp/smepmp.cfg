load_byte_hit :
  config :
    -check ISA:=regex(.*32.*); check ISA:=regex(.*I.*Zicsr.*);def TEST=True;def rvtest_mtrap_routine=True ;
  mnemonics:
    "{csrrw ,csrrs ,csrrc,lb,lh,lw,sw,sh,sb}": 0
  csr_comb:
    (  ((pmpcfg0 >> 8)&0xFF) == 0x88 )   : 0
  val_comb:
    'mode == {"S","U","M"} and  mnemonic == {"sb","sh","sw"} and ${SMEPMP_TOR} and (((pmpcfg0 >> 8)&0x000000FF) == 0x88 ) and (mcause== ${CAUSE_STORE_ACCESS}) ': 0
    'mode == {"S","U","M"} and  mnemonic == {"lb","lh","lw"} and ${SMEPMP_TOR} and (((pmpcfg0 >> 8)&0x000000FF) == 0x88 ) and (mcause== ${CAUSE_LOAD_ACCESS})  ': 0
    'mode == {"S","U","M"} and  mnemonic == {"jalr"} and ${SMEPMP_TOR} and (((pmpcfg0 >> 8)&0x000000FF) == 0x88 ) and (mcause== ${CAUSE_FETCH_ACCESS})  ': 0
    
