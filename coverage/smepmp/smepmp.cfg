SMEPMP_MML_RWX :
  config :
    -check ISA:=regex(.*32.*); check ISA:=regex(.*I.*Zicsr.*);def TEST=True;def rvtest_mtrap_routine=True ;def rvtest_strap_routine = True;
  mnemonics:
    "{csrrw ,csrrs ,csrrc,lb,lh,lw,sw,sh,sb,jal}": 0
  csr_comb:
    (  (mseccfg & 0x1) == 0x1 )  : 0
  val_comb:
    'mode == {"S","U","M"} and  mnemonic == {"sb","sh","sw"} and ${SMEPMP_TOR} and {${TOR_NONE},${TOR_R},${TOR_W},${TOR_X},${TOR_RW},${TOR_RX},${TOR_WX},${TOR_RWX} } and (mcause== ${CAUSE_STORE_ACCESS})  ': 0
    'mode == {"S","U","M"} and  mnemonic == {"lb","lh","lw"} and ${SMEPMP_TOR} and {${TOR_NONE},${TOR_R},${TOR_W},${TOR_X},${TOR_RW},${TOR_RX},${TOR_WX},${TOR_RWX} } and (mcause== ${CAUSE_LOAD_ACCESS})  ': 0
    'mode == "M" and  mnemonic == "jal" and mode_change== {"M to M","U to M","S to M"} and (mcause== ${CAUSE_FETCH_ACCESS})  ': 0
