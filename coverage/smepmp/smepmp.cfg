#RLB casess
RLB :
  config :
    -check ISA:=regex(.*32.*); check ISA:=regex(.*I.*Zicsr.*);def TEST=True;def rvtest_mtrap_routine=True; def rvtest_strap_routine;
  mnemonics:
    "{csrrw ,csrrs }" : 0
  csr_comb :
   ( (mseccfg & 0x4) == 0x04 ) : 0
  val_comb :
    '(pmpcfg0 & ${PMP_L_BITS}  >= 0x80) and  ((mseccfg & 0x4 ) ==0x0) and (rs1_val & 0x4 == 0x4  )  ' : 0
    '((mseccfg & 0x4) == 0x4 ) and (pmpcfg0 & 0x80  == 0x80) and (rs1_val != old_csr_val("pmpaddr0")) and (rs1_val == pmpaddr0) ' : 0
    '((mseccfg & 0x4) == 0x4 ) and (pmpcfg0 & 0x80  == 0x80) and  ( ( rs1_val & 0xFF) != old_csr_val("pmpcfg0") ) and ( ( rs1_val & 0xFF) == (0xFF & pmpcfg0 ))  ' : 0
#check  CSR pmpaddr1 (0x3B1) <- 0x20000279
MMWP :
  config :
    -check ISA:=regex(.*32.*); check ISA:=regex(.*I.*Zicsr.*);def TEST=True; def rvtest_strap_routine ; def rvtest_mtrap_routine = True ;
  mnemonics:
    "{csrrw ,csrrs ,csrrc,lb,lh,lw,sw,sh,sb,jal}": 0
  csr_comb:
    ( mseccfg & 0x2 == 0x2)   : 0
  val_comb:
    ' mode=="M" and mnemonic == "csrrw" and ( mseccfg & 0x2 == 0x2)  and (rs1_val & 0x2 == 0x2) and (old_csr_val("mseccfg") & 0x2 ==0x2) ' : 0
    ' mode == {"S","U","M"} and mnemonic == {"lb","lh","lw"} and (((rs1_val + imm_val)>>2 ) >= pmpaddr1) and (((rs1_val + imm_val)>>2 ) < pmpaddr2)  and mcause== ${CAUSE_LOAD_ACCESS}  and  ( mseccfg & 0x2 == 0x2) ' : 0 
    ' mode == {"S","U","M"} and mnemonic == {"sb","sh","sw"} and (((rs1_val + imm_val)>>2 ) >= pmpaddr1) and (((rs1_val + imm_val)>>2 ) < pmpaddr2)   and mcause == ${CAUSE_STORE_ACCESS}   and  ( mseccfg & 0x2 == 0x2) ' : 0 
    ' mode == "M"   and mnemonic == "jal" and mode_change == {"M to M","U to M","S to M"}  and  ( mseccfg & 0x2 == 0x2) and mcause == ${CAUSE_FETCH_ACCESS}   ' : 0
MML_Reserved_Encoding :
  config :
    -check ISA:=regex(.*32.*); check ISA:=regex(.*I.*Zicsr.*);def TEST=True;def rvtest_mtrap_routine = True ;
  mnemonics:
    "{csrrw ,csrrs }" : 0
  csr_comb :
    'mode == "M" and mnemonic == "csrrs"  and (mseccfg & 0x4 == 0x0 ) and  ( pmpcfg0 & 0x7 != {0x2,0x6}  ) and ( pmpcfg0 & 0x8700 != {0x82,0x86}  )    ' : 0
  val_comb :
    'mode == "M" and mnemonic == "csrrs"  and (mseccfg & 0x4 == 0x0 ) and  ( pmpcfg0 & 0x7 != {0x2,0x6}  ) and ( pmpcfg0 & 0x8700 != {0x82,0x86}  )    ' : 0
MSECCFG_M :
  config :
    -check ISA:=regex(.*32.*); check ISA:=regex(.*I.*Zicsr.*);def TEST=True;def rvtest_mtrap_routine = True ;
  mnemonics:
    "{csrrw ,csrrs,csrrc}" : 0
  csr_comb :
    ' mode == "M"   and mseccfg  == 0x7 ' : 0
    ' mode =="S"  and mseccfg  != {0x7,0x4,0x1,0x2} ' : 0
    ' mode =="U"  and mseccfg  != {0x7,0x4,0x1,0x2} ' : 0
