load_byte_hit :
  config :
    -check ISA:=regex(.*32.*); check ISA:=regex(.*I.*Zicsr.*);def TEST=True;def rvtest_mtrap_routine=True ;
  mnemonics:
    "{csrrw ,csrrs ,csrrc,lb,lh,lw,sw,sh,sb}": 0
  csr_comb:
    (  ((pmpcfg0 >> 8)&0xFF) == 0x88 )   : 0
  val_comb:
    'mode == {"S","U","M"} and  mnemonic == {"sb","sh","sw","lb","lh","lw"} and (    (((rs1_val + imm_val)>>2 ) >= pmpaddr0) and                                      ( (((rs1_val + imm_val)>>2 ) <= pmpaddr1)  )   )': 0
    
    
