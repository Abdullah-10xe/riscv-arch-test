SMEPMP_MML_RWX:
  config :
    -check ISA:=regex(.*64.*); check ISA:=regex(.*I.*Zicsr.*);def TEST=True;def rvtest_mtrap_routine=True ;def rvtest_strap_routine = True;
  mnemonics:
    "{csrrw ,csrrs ,csrrc,lb,lh,lw,sw,sh,sb,jal}": 0
  csr_comb:
    (  (mseccfg & 0x1) == 0x1 )  : 0
  val_comb:
    'mode == {"S","U","M"} and  mnemonic == {"sb","sh","sw"} and ${SMEPMP_TOR} and {${TOR_NONE},${TOR_R},${TOR_X},${TOR_RX}} and (mcause== ${CAUSE_STORE_ACCESS})  ': 0
    'mode == {"S","U","M"} and  mnemonic == {"sb","sh","sw"} and ${SMEPMP_TOR} and {${TOR_RW},${TOR_RWX}, ${TOR_WX}} and (mcause!= ${CAUSE_STORE_ACCESS})  ': 0
    'mode == {"S","U"} and  mnemonic == {"sb","sh","sw"} and ${SMEPMP_TOR} and ${TOR_W} and (mcause== ${CAUSE_STORE_ACCESS})  ': 0
    'mode == {"S","U","M"} and  mnemonic == {"lb","lh","lw"} and ${SMEPMP_TOR} and {${TOR_NONE},${TOR_X} } and (mcause== ${CAUSE_LOAD_ACCESS})   ': 0
    'mode == {"S","U"} and  mnemonic == {"lb","lh","lw"} and ${SMEPMP_TOR} and {${TOR_R},${TOR_RW},${TOR_RX},${TOR_RWX} } and (mcause!= ${CAUSE_LOAD_ACCESS})  ': 0
    'mode == "M" and  mnemonic == {"lb","lh","lw"} and ${SMEPMP_TOR} and {${TOR_R},${TOR_RW},${TOR_RX},${TOR_RWX} } and (mcause == ${CAUSE_LOAD_ACCESS})  ': 0
    'mode == {"M","S","U"} and  mnemonic == {"lb","lh","lw"} and ${SMEPMP_TOR} and {${TOR_WX},${TOR_W} } and (mcause!= ${CAUSE_LOAD_ACCESS})  ': 0
    ' mode_change =={"S to M","U to M"}  and mnemonic == "jal"  and (mcause== ${CAUSE_FETCH_ACCESS}) and {${TOR_NONE},${TOR_W},${TOR_WX},${TOR_R},${TOR_RW} }   ': 0
    '  mnemonic == "jal" and mode =={"S","U"}  and (mcause!= ${CAUSE_FETCH_ACCESS}) and {${TOR_X},${TOR_RX},${TOR_RWX}} and (mcause != ${CAUSE_LOAD_ACCESS}) ': 0
    ' mode == "M" and mnemonic == "jal"  and (mcause == ${CAUSE_FETCH_ACCESS}) and {${TOR_NONE},${TOR_W},${TOR_WX},${TOR_R},${TOR_RW},${TOR_X},${TOR_RX},${TOR_RWX} } ': 0
# SMEPMP
SMEPMP_MML_LRWX :
  config :
    -check ISA:=regex(.*32.*); check ISA:=regex(.*I.*Zicsr.*);def TEST=True;def rvtest_mtrap_routine=True ; def rvtest_strap_routine = True;
  mnemonics:
    "{csrrw ,csrrs ,csrrc,lb,lh,lw,sw,sh,sb,jal}": 0
  csr_comb:
    (  (mseccfg &0x1) == 0x1 )   : 0
  val_comb:
    'mode == {"S","U","M"} and  mnemonic == {"sb","sh","sw"} and ${SMEPMP_TOR} and {${TOR_LNONE},${TOR_LR},${TOR_LW},${TOR_LX},${TOR_LRX},${TOR_LWX},${TOR_LRWX} } and (mcause== ${CAUSE_STORE_ACCESS}) ': 0
    'mode == "M" and  mnemonic == {"sb","sh","sw"} and ${SMEPMP_TOR} and ${TOR_LRW} and (mcause!= ${CAUSE_STORE_ACCESS}) ': 0
    'mode == "M" and  mnemonic == {"lb","lh","lw"} and ${SMEPMP_TOR} and {${TOR_LNONE},${TOR_LW},${TOR_LX}} and (mcause== ${CAUSE_LOAD_ACCESS})  ': 0
    'mode == {"S","U"} and  mnemonic == {"lb","lh","lw"} and ${SMEPMP_TOR} and ${TOR_LRWX} and (mcause != ${CAUSE_LOAD_ACCESS})  ': 0
    'mode == {"S","U"} and  mnemonic == {"lb","lh","lw"} and ${SMEPMP_TOR} and {${TOR_LNONE},${TOR_LR},${TOR_LW},${TOR_LRX},${TOR_LX},${TOR_LWX},${TOR_LRX}} and (mcause== ${CAUSE_LOAD_ACCESS})  ': 0
    'mode == "M" and  mnemonic == {"lb","lh","lw"} and ${SMEPMP_TOR} and {${TOR_LWX},${TOR_LRWX},${TOR_LR},${TOR_RX},${TOR_RW}} and (mcause != ${CAUSE_LOAD_ACCESS})  ': 0
    'mode == "M" and  mnemonic == "jal"  and {${TOR_LNONE},${TOR_RW},${TOR_R},${TOR_LRWX}} and (mcause== ${CAUSE_FETCH_ACCESS})  ': 0 
    'mode == "M" and  mnemonic == "jal" and {${TOR_LX},${TOR_W},${TOR_WX},${TOR_RX}} and (mcause!= ${CAUSE_FETCH_ACCESS})  ': 0  
    'mnemonic == "jal" and mode_change== {"S to M","U to M" } and {${TOR_W},${TOR_WX}} and (mcause!= ${CAUSE_FETCH_ACCESS})  ': 0 
    'mnemonic == "jal" and mode_change== {"S to U","U to M"} and {${TOR_LNONE},${TOR_RW},${TOR_R},${TOR_LRWX},${TOR_WX},${TOR_RX}} and (mcause== ${CAUSE_FETCH_ACCESS})  ': 0 
#RLB casess
RLB :
  config :
    -check ISA:=regex(.*64.*); check ISA:=regex(.*I.*Zicsr.*);def TEST=True;def rvtest_mtrap_routine=True; def rvtest_strap_routine;
  mnemonics:
    "{csrrw ,csrrs }" : 0
  csr_comb :
   ( (mseccfg & 0x4) == 0x04 ) : 0
  val_comb :
    '(pmpcfg0 & ${PMP_L_BITS}  >= 0x80) and  ((mseccfg & 0x4 ) ==0x0) and (rs1_val & 0x4 == 0x4  )  ' : 0
    '((mseccfg & 0x4) == 0x4 ) and (pmpcfg0 & 0x80  == 0x80) and (rs1_val != old_csr_val("pmpaddr0")) and (rs1_val == pmpaddr0) ' : 0
    '((mseccfg & 0x4) == 0x4 ) and (pmpcfg0 & 0x80  == 0x80) and  ( ( rs1_val & 0xFF) != old_csr_val("pmpcfg0") ) and ( ( rs1_val & 0xFF) == (0xFF & pmpcfg0 ))  ' : 0
#check  CSR pmpaddr1 (0x3B1) <- 0x20000279
MMWP :
  config :
    -check ISA:=regex(.*64.*); check ISA:=regex(.*I.*Zicsr.*);def TEST=True; def rvtest_strap_routine ; def rvtest_mtrap_routine = True ;
  mnemonics:
    "{csrrw ,csrrs ,csrrc,lb,lh,lw,sw,sh,sb,jal}": 0
  csr_comb:
    ( mseccfg & 0x2 == 0x2)   : 0
  val_comb:
    ' mode=="M" and mnemonic == "csrrw" and ( mseccfg & 0x2 == 0x2)  and (rs1_val & 0x2 == 0x2) and (old_csr_val("mseccfg") & 0x2 ==0x2) ' : 0
    ' mode == "M" and mnemonic == {"lb","lh","lw"} and (((rs1_val + imm_val)>>2 ) >= pmpaddr1) and (((rs1_val + imm_val)>>2 ) < pmpaddr2)  and mcause== ${CAUSE_LOAD_ACCESS}  and  ( mseccfg & 0x2 == 0x2) ' : 0 
    ' mode == "M" and mnemonic == {"sb","sh","sw"} and (((rs1_val + imm_val)>>2 ) >= pmpaddr1) and (((rs1_val + imm_val)>>2 ) < pmpaddr2)   and mcause == ${CAUSE_STORE_ACCESS}   and  ( mseccfg & 0x2 == 0x2) ' : 0 
    ' mode == "M"   and mnemonic == "jal" and   ( mseccfg & 0x2 == 0x2) and mcause == ${CAUSE_FETCH_ACCESS}   ' : 0
MML_Reserved_Encoding :
  config :
    -check ISA:=regex(.*64.*); check ISA:=regex(.*I.*Zicsr.*);def TEST=True;def rvtest_mtrap_routine = True ;
  mnemonics:
    "{csrrw ,csrrs }" : 0
  csr_comb :
    'mode == "M"   and (mseccfg & 0x4 == 0x0 ) and  ( pmpcfg0 & 0x7 != {0x2,0x6}  ) and ( pmpcfg0 & 0x8700 != {0x82,0x86}  )    ' : 0
    'mode == "M" and (mseccfg &0x5 ==0x1) ' : 0
  val_comb :
    'mode == "M" and mnemonic == "csrrs"  and (mseccfg & 0x4 == 0x0 ) and  ( pmpcfg0 & 0x7 != {0x2,0x6}  ) and ( pmpcfg0 & 0x8700 != {0x82,0x86}  )    ' : 0
    'mode == "M" and  (mseccfg &0x5 ==0x1) and (pmpcfg0 & 0x87 !=0x82) and ( pmpcfg0 & 0x87 !=0x86 ) and ( pmpcfg0 & 0x87 !=0x84  )' : 0
MSECCFG_M :
  config :
    -check ISA:=regex(.*64.*); check ISA:=regex(.*I.*Zicsr.*);def TEST=True;def rvtest_mtrap_routine = True ;
  mnemonics:
    "{csrrw ,csrrs,csrrc}" : 0
  csr_comb :
    ' mode == "M"   and mseccfg  == 0x7 ' : 0
    ' mode_change  == "S to M"  and (mseccfg   == 0x0 )' : 0
    ' mode_change =="U to M"  and  (mseccfg   == 0x0 ) ' : 0
MML_NO_Matching : 
  config :
    -check ISA:=regex(.*64.*); check ISA:=regex(.*I.*Zicsr.*);def TEST=True;def rvtest_mtrap_routine = True ;
  mnemonics:
    '{csrrw,csrrs,jal}' : 0
  csr_comb:
    (mseccfg & 0x3 == 0x1) : 0
  val_comb :
    'mode == "M" and  mcause == ${CAUSE_FETCH_ACCESS} and mseccfg & 0x3 == 0x1 ' : 0
